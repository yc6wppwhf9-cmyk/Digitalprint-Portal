<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Print Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Digital Print Portal</h1>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="designer">Designer</button>
      <button class="tab" role="tab" data-view="production">Production</button>
    </nav>
  </header>

  <div id="toast" class="toast" role="status" hidden></div>

  <main>
    <!-- Designer: upload PDF + approval checkbox -->
    <section id="view-designer" class="view" hidden>
      <div class="panel">
        <h2>Upload digital print</h2>
        <form id="upload-form" novalidate>
          <label>Design PDF <span class="req">*</span>
            <input type="file" name="pdf" accept="application/pdf,.pdf" required>
          </label>
          <div class="row">
            <label>Job title
              <input type="text" name="title" placeholder="Defaults to the file name">
            </label>
            <label>Customer
              <input type="text" name="customer">
            </label>
          </div>
          <label>Notes
            <textarea name="notes" rows="2"></textarea>
          </label>
          <fieldset class="approval">
            <legend>Approval <span class="req">*</span></legend>
            <label class="check"><input type="checkbox" name="approval" value="approved"> Approved</label>
            <label class="check"><input type="checkbox" name="approval" value="preapproved"> Pre-approved</label>
          </fieldset>
          <button type="submit" class="primary">Upload</button>
        </form>
      </div>

      <div class="panel">
        <h2>Uploaded designs</h2>
        <table class="jobs-table">
          <thead>
            <tr><th>Job</th><th>PDF</th><th>Approval</th><th>Current stage</th><th></th></tr>
          </thead>
          <tbody id="designer-jobs"></tbody>
        </table>
        <p id="designer-empty" class="muted" hidden>No designs uploaded yet.</p>
      </div>
    </section>

    <!-- Production: board by stage -->
    <section id="view-production" class="view" hidden>
      <div id="board" class="board"></div>
    </section>
  </main>

  <dialog id="history-dialog">
    <h3 id="history-title"></h3>
    <ol id="history-list" class="history"></ol>
    <form method="dialog"><button>Close</button></form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
